name: GA-100 Revision 2 Regression Checks
on:
  push:
    branches:
      - feature/ga-100-revision-2
    paths:
      - playtest/ga-100/**
      - tests/ga100-revision2.test.cjs
      - .github/workflows/ga100-revision2.yml
  pull_request:
    paths:
      - playtest/ga-100/**
      - tests/ga100-revision2.test.cjs
      - .github/workflows/ga100-revision2.yml
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test physics and camera behavior
        run: node --test tests/ga100-revision2.test.cjs
