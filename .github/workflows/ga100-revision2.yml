name: GA-100 2D and WebGL Regression Checks
on:
  push:
    branches:
      - feature/ga-100-revision-2
      - feature/ga-110-webgl-3d-vertical-slice
    paths:
      - playtest/ga-100/**
      - playtest/ga-100-webgl/**
      - tests/ga100-revision2.test.cjs
      - tests/ga100-webgl.test.cjs
      - .github/workflows/ga100-revision2.yml
  pull_request:
    paths:
      - playtest/ga-100/**
      - playtest/ga-100-webgl/**
      - tests/ga100-revision2.test.cjs
      - tests/ga100-webgl.test.cjs
      - .github/workflows/ga100-revision2.yml
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test existing 2D game and new WebGL terrain/physics
        run: node --test tests/ga100-revision2.test.cjs tests/ga100-webgl.test.cjs
